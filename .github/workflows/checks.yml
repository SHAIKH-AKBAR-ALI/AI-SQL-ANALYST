name: checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LANGFUSE_ENABLED: 'false'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix frontend
      - name: Reject local files and private Markdown in Git
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, paths):
              path = PurePosixPath(name)
              assert path.suffix.lower() != '.md' or name == 'README.md', f'Only root README.md may be published: {name}'
              assert not any(part in {'.venv', '.tmp', 'node_modules', '.next', '.vercel', '__pycache__', 'uploads', 'backups'} for part in path.parts), f'Local file tracked: {name}'
              assert not (path.name.startswith('.env') and path.name != '.env.example'), f'Environment file tracked: {name}'
          PY
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - name: Start disposable local Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: python scripts/setup_local.py
      - name: Unit, adversarial, Auth and database checks
        working-directory: backend
        env:
          PHASE2_INTEGRATION: '1'
        run: python -m unittest discover -s tests -v
      - name: Hand-checked fixture benchmark
        run: python scripts/evaluate_agent.py
      - run: npm run test:frontend
      - run: npm run typecheck
      - run: npm run build
      - name: Database advisors
        run: npx supabase db advisors --local --type all --level warn
      - name: Stop disposable stack
        if: always()
        run: npx supabase stop
  deploy-vercel:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_DEPLOYMENTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require deployment credentials
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - run: npm install --global vercel@55.0.0
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build checked commit
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy checked build
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
