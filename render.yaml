services:
  - type: web
    name: hisaabai-api
    runtime: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: QUERY_DATABASE_URL
        sync: false
      - key: IMPORT_DATABASE_URL
        sync: false
      - key: DEMO_DATABASE_URL
        sync: false
      - key: LANGFUSE_ENABLED
        value: "false"
